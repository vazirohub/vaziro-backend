<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="100%" height="100%" fill="none">
  <!-- Vaziro Iconic Mark -->
  <g transform="translate(10, 10)">
    <!-- House / Badge Outline -->
    <path d="M40 8 L72 32 C76 35 78 40 78 45 L78 66 C78 74 72 80 64 80 L16 80 C8 80 2 74 2 66 L2 45 C2 40 4 35 8 32 Z" 
          fill="none" stroke="#0F172A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Stylized 'V' with Emerald Ascending Arrow -->
    <path d="M20 38 L38 68 L66 22" 
          fill="none" stroke="#059669" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Arrow Head -->
    <polygon points="66,10 78,28 56,26" fill="#059669" />
  </g>

  <!-- Typography: Vaziro -->
  <text x="115" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" fill="#0F172A" letter-spacing="-1.5">
    Vaziro
  </text>
  
  <!-- Sub-badge: .in with Emerald Green -->
  <text x="282" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="20" fill="#059669" letter-spacing="0">
    .in
  </text>
  
  <!-- Subtle Tagline in SVG -->
  <text x="117" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#64748B" letter-spacing="2.5">
    DELHI NCR • MARKETPLACE
  </text>
</svg>
